<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plan · Do · See Diary</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>Plan · Do · See Diary</h1>

  <p>
    ⚠️ 현재 로그인 기능이 없습니다.
    링크를 아는 사람은 누구나 볼 수 있습니다.
  </p>

  <hr>

  <h2>Plan — 계획 세우기</h2>

  <form>
    <label>계획명</label><br>
    <input type="text" id="planName" placeholder="오늘의 계획"><br><br>

    <label>시작일</label><br>
    <input type="date" id="startDate"><br><br>

    <label>종료일</label><br>
    <input type="date" id="endDate"><br><br>

    <label>우선순위</label><br>
    <select id="priority">
      <option value="높음">높음</option>
      <option value="보통" selected>보통</option>
      <option value="낮음">낮음</option>
    </select><br><br>

    <label>성공 기준</label><br>
    <textarea id="successCriteria" placeholder="무엇을 하면 성공인가요?"></textarea><br><br>

    <label>예상 시간</label><br>
    <input type="number" id="estimatedHours" min="0" placeholder="시간"> 시간<br><br>

    <button type="submit">계획 저장</button>
  </form>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="script.js"></script>

</body>
</html>
