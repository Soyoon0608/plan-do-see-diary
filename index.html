<!DOCTYPE html>

<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Plan · Do · See Diary</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

  <h1>Plan · Do · See Diary</h1>

  <p>
    ⚠️ 현재 로그인 기능이 없습니다.
    링크를 아는 사람은 누구나 볼 수 있습니다.
  </p>

  <hr>

  <!-- ============================== -->

  <!-- Plan — 계획 세우기 -->

  <!-- ============================== -->

  <h2>Plan — 계획 세우기</h2>

  <form id="planForm">

```
<label>계획명</label><br>

<input
  type="text"
  id="planName"
  placeholder="오늘의 계획"
>

<br><br>


<label>시작일</label><br>

<input
  type="date"
  id="startDate"
>

<br><br>


<label>종료일</label><br>

<input
  type="date"
  id="endDate"
>

<br><br>


<label>우선순위</label><br>

<select id="priority">

  <option value="높음">
    높음
  </option>

  <option
    value="보통"
    selected
  >
    보통
  </option>

  <option value="낮음">
    낮음
  </option>

</select>

<br><br>


<label>성공 기준</label><br>

<textarea
  id="successCriteria"
  placeholder="무엇을 하면 성공인가요?"
></textarea>

<br><br>


<label>예상 시간</label><br>

<input
  type="number"
  id="estimatedHours"
  min="0"
  placeholder="시간"
>

시간

<br><br>


<button type="submit">
  계획 저장
</button>
```

  </form>

  <hr>

  <!-- ============================== -->

  <!-- Do — 할 일 관리 -->

  <!-- ============================== -->

  <h2>Do — 할 일 관리</h2>

  <form id="taskForm">

```
<label>할 일</label><br>

<input
  type="text"
  id="taskName"
  placeholder="예: SQL Injection 실습"
  required
>

<br><br>


<label>연결할 계획</label><br>

<select
  id="taskPlanId"
  required
>

  <option value="">
    계획을 선택하세요
  </option>

</select>

<br><br>


<label>마감일</label><br>

<input
  type="date"
  id="taskDueDate"
>

<br><br>


<label>우선순위</label><br>

<select id="taskPriority">

  <option value="높음">
    높음
  </option>

  <option
    value="보통"
    selected
  >
    보통
  </option>

  <option value="낮음">
    낮음
  </option>

</select>

<br><br>


<label>태그</label><br>

<input
  type="text"
  id="taskTag"
  placeholder="예: 보안, 공부"
>

<br><br>


<label>예상 시간</label><br>

<input
  type="number"
  id="taskEstimatedHours"
  min="0"
  step="0.5"
  placeholder="시간"
>

시간

<br><br>


<button type="submit">
  할 일 추가
</button>
```

  </form>

  <hr>

  <!-- ============================== -->

  <!-- 할 일 검색 -->

  <!-- ============================== -->

  <h3>할 일 목록</h3>

  <div>

```
<input
  type="text"
  id="taskSearch"
  placeholder="할 일 검색"
>
```

  </div>

  <br>

  <!-- ============================== -->

  <!-- 필터 -->

  <!-- ============================== -->

  <div>

```
<label>계획 필터</label>

<select id="taskPlanFilter">

  <option value="">
    전체 계획
  </option>

</select>


<label>상태 필터</label>

<select id="taskStatusFilter">

  <option value="">
    전체
  </option>

  <option value="진행 중">
    진행 중
  </option>

  <option value="완료">
    완료
  </option>

</select>


<label>우선순위 필터</label>

<select id="taskPriorityFilter">

  <option value="">
    전체
  </option>

  <option value="높음">
    높음
  </option>

  <option value="보통">
    보통
  </option>

  <option value="낮음">
    낮음
  </option>

</select>
```

  </div>

  <br>

  <!-- ============================== -->

  <!-- 정렬 -->

  <!-- ============================== -->

  <div>

```
<label>정렬</label>

<select id="taskSort">

  <option value="created_desc">
    최근 추가순
  </option>

  <option value="due_asc">
    마감일 빠른 순
  </option>

  <option value="priority_desc">
    우선순위 높은 순
  </option>

  <option value="hours_asc">
    예상 시간 적은 순
  </option>

  <option value="hours_desc">
    예상 시간 많은 순
  </option>

</select>
```

  </div>

  <br>

  <div id="taskList"></div>

  <hr>

  <!-- ================================================= -->

  <!-- Card 3 — 실제로 한 일 적기 -->

  <!-- ================================================= -->

  <h2>See — 실제로 한 일 적기</h2>

  <form id="executionForm">

```
<!-- ========================== -->
<!-- 할 일 선택 -->
<!-- ========================== -->

<label>실행한 할 일</label><br>

<select
  id="executionTaskId"
  required
>

  <option value="">
    할 일을 선택하세요
  </option>

</select>

<br><br>


<!-- ========================== -->
<!-- 시작 시각 -->
<!-- ========================== -->

<label>시작 시각</label><br>

<input
  type="datetime-local"
  id="executionStartTime"
  required
>

<br><br>


<!-- ========================== -->
<!-- 종료 시각 -->
<!-- ========================== -->

<label>끝난 시각</label><br>

<input
  type="datetime-local"
  id="executionEndTime"
  required
>

<br><br>


<!-- ========================== -->
<!-- 실제 걸린 시간 -->
<!-- ========================== -->

<label>실제로 걸린 시간</label><br>

<input
  type="number"
  id="actualHours"
  min="0"
  step="0.1"
  placeholder="시간"
  required
>

시간

<br><br>


<!-- ========================== -->
<!-- 막혔던 이유 -->
<!-- ========================== -->

<label>막혔던 이유</label><br>

<textarea
  id="blockedReason"
  placeholder="어디에서 막혔나요?"
></textarea>

<br><br>


<button type="submit">
  실행 기록 저장
</button>
```

  </form>

  <hr>

  <!-- ============================== -->

  <!-- 실행 기록 목록 -->

  <!-- ============================== -->

  <h3>실행 기록</h3>

  <div id="executionList">

```
실행 기록을 불러오는 중입니다...
```

  </div>

  <!-- ============================== -->

  <!-- JavaScript -->

  <!-- ============================== -->

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="script.js"></script>

</body>
</html>
